# Builds the Fedora RPM on Fedora, test-installs it, and attaches it to the
# release. Runs for every published release, or by hand for an existing tag.
name: RPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          dnf -y install rpm-build rpmdevtools rpmlint make gh
          rpmdev-setuptree
          spec=packaging/rpm/hyprpresent.spec
          version=$(rpmspec -q --qf '%{version}\n' "$spec" | head -1)
          test "v$version" = "$TAG" || { echo "spec version $version doesn't match $TAG"; exit 1; }
          spectool -g -R "$spec"
          rpmbuild -ba "$spec"

      - name: Lint
        run: rpmlint packaging/rpm/hyprpresent.spec ~/rpmbuild/RPMS/noarch/*.rpm || true

      - name: Test install
        run: |
          dnf -y install ~/rpmbuild/RPMS/noarch/hyprpresent-*.rpm
          hyprpresent version
          # No Hyprland in the container: check must say so and exit 2.
          set +e; hyprpresent check; status=$?; set -e
          test "$status" -eq 2

      - name: Attach to the release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$TAG" ~/rpmbuild/RPMS/noarch/*.rpm ~/rpmbuild/SRPMS/*.rpm --clobber -R "$GITHUB_REPOSITORY"
